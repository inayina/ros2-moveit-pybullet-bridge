# Downstream summary after loading and replaying a middle-repo handoff bundle.
schema_version: downstream_replay_summary_v0
summary_id: replay_YYYYMMDD_short_name
created_at: YYYY-MM-DDTHH:MM:SSZ
source_repo: ros2-moveit-pybullet-bridge
target_repos:
  - robot-arm-episode-data-lab
  - ros2-arm-teleoperation-suite
downstream_commit: unknown
middle_commit: unknown
upstream_commit: unknown

handoff:
  handoff_path: /path/to/bridge_handoff
  handoff_id: example_handoff_id
  release_id: example_release_id
  policy_id: example_policy_id
  schema_id: panda_ee_delta_gripper_v0
  action_type: ee_delta_gripper
  action_dim: 7

load_gate:
  status: pass  # pass | fail | watch
  loaded_manifest: false
  loaded_replay_jsonl: false
  rejected_reason: null
  missing_manifest_keys: []

runtime_io:
  robot_profile: panda
  command_topic: /bridge/command
  command_type: trajectory_msgs/msg/JointTrajectory
  control_rate_hz: null
  quaternion_order: xyzw
  gripper_range_m: [0.0, 0.08]

replay_result:
  status: pass  # pass | fail | watch
  replayed_steps: 0
  planning_failures: 0
  action_limit_violations: 0
  e_stop_or_hold_events: 0
  max_tracking_error_rad: null
  mean_tracking_error_rad: null
  max_inference_latency_ms: null

failure_modes:
  - type: example_failure
    count: 0
    likely_owner: unknown  # upstream | middle | downstream | unknown
    evidence: Short evidence summary.

feedback_requests:
  upstream: []
  middle: []
  downstream: []

safe_attachments:
  small_reports: []
  tiny_replay_excerpt: []

do_not_attach:
  - full replay logs
  - rollout datasets
  - videos
  - checkpoint binaries
  - full benchmark directories
